name: Test CI

on:
  pull_request:
    branches: [arckep/engine]
  push:
    branches: [arckep/engine]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional source commit for an isolated baseline typecheck/build
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check for duplicate runs
  check-duplicate-run:
    name: Check Duplicate Run
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  # Package tests - all packages in single job to save runner resources
  test-packages:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && !inputs.baseline_ref
    runs-on: ubuntu-latest
    name: Test Packages
    env:
      PACKAGES: '@lobechat/file-loaders @lobechat/prompts @lobechat/model-runtime @lobechat/web-crawler @lobechat/utils @lobechat/python-interpreter @lobechat/context-engine @lobechat/agent-runtime @lobechat/conversation-flow @lobechat/ssrf-safe-fetch @lobechat/memory-user-memory model-bank'

    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test packages with coverage
        run: |
          status=0
          for package in $PACKAGES; do
            echo "::group::Testing $package"
            bun run --filter $package test:coverage || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload coverage to Codecov
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Build common args
          COMMON_ARGS="--git-service github"

          # PR args setup
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMON_ARGS="$COMMON_ARGS --pr ${{ github.event.pull_request.number }}"
            COMMON_ARGS="$COMMON_ARGS --sha ${{ github.event.pull_request.head.sha }}"
            # Fork PR needs username:branch format for tokenless upload
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.label }}"
            else
              COMMON_ARGS="$COMMON_ARGS --branch ${{ github.event.pull_request.head.ref }}"
            fi
          fi

          # Token (if available)
          if [ -n "$CODECOV_TOKEN" ]; then
            COMMON_ARGS="$COMMON_ARGS -t $CODECOV_TOKEN"
          fi

          for package in $PACKAGES; do
            dir="${package#@lobechat/}"
            if [ -f "./packages/$dir/coverage/lcov.info" ]; then
              echo "Uploading coverage for $dir..."
              ./codecov upload-coverage \
                $COMMON_ARGS \
                --file ./packages/$dir/coverage/lcov.info \
                --flag packages/$dir \
                --disable-search
            fi
          done

  # App tests - run sharded tests
  test-app:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && !inputs.baseline_ref
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: Test App (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install isolated cancellation test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run tests
        run: bunx vitest --coverage --silent='passed-only' --reporter=default --reporter=blob --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

  # Merge sharded test reports and upload coverage
  merge-app-coverage:
    needs: test-app
    if: ${{ !cancelled() && needs.test-app.result == 'success' }}
    name: Merge and Upload App Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: bunx vitest --merge-reports --reporter=default --coverage

      - name: Upload App Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/app/lcov.info
          flags: app

  check-engine:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    name: Check and Build Engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TELEMETRY_DISABLED: '1'
      AUTH_SECRET: ci-only-not-a-production-secret-0000000000
      KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
      APP_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline_ref || github.sha }}
      - name: Setup environment
        uses: ./.github/actions/setup-env
      - name: Install deps
        id: install
        run: pnpm install --frozen-lockfile
      - name: Install isolated auth test dependency
        if: ${{ !inputs.baseline_ref }}
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Verify atomic signup against an isolated PostgreSQL cluster
        if: ${{ !inputs.baseline_ref }}
        run: pnpm exec vitest run --maxWorkers=1 --minWorkers=1 --silent=passed-only src/libs/better-auth/__tests__/arckepProvisioning.test.ts
        env:
          TEST_AUTH_POSTGRES: '1'
      - name: Test tool discovery and calculator instructions
        if: ${{ !inputs.baseline_ref }}
        run: pnpm exec vitest run --config packages/builtin-tool-activator/vitest.config.mts --maxWorkers=1 --minWorkers=1 packages/builtin-tool-activator/src/systemRole.test.ts packages/builtin-tool-calculator/src/calculation-contract.test.ts
      - name: Typecheck engine
        run: pnpm type-check
      - name: Build desktop and mobile web clients and Next server
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  test-databsae:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true' && !inputs.baseline_ref
    name: Test Database

    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s  --health-retries 5


        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test Coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm --filter @lobechat/database test:coverage
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_DRIVER: node
          KEY_VAULTS_SECRET: Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ=
          S3_PUBLIC_DOMAIN: https://example.com
          APP_URL: https://home.com

      - name: Upload Database coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/database/coverage/lcov.info
          flags: database
